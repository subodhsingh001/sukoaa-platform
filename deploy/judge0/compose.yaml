name: sukoaa-judge0
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-engine: &engine
  image: judge0/judge0:1.13.1@sha256:6b5d6a66aa19a8e878a52ea3c6a560afc1086734d96e2885b561fd5c6018f082
  env_file: judge0.conf
  volumes:
    - ./judge0.conf:/judge0.conf:ro
  privileged: true
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  server:
    <<: *engine
    networks: [edge, backend]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "u=URI('http://127.0.0.1:2358/languages'); r=Net::HTTP.get_response(u,{'X-Auth-Token'=>ENV.fetch('AUTHN_TOKEN')}); exit(r.code=='200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
  worker:
    <<: *engine
    command: ["./scripts/workers"]
    networks: [backend]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
  db:
    image: library/postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run manage.py init first}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [backend]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 24
  redis:
    image: library/redis:7.2-alpine@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run manage.py init first}
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction']
    volumes: ["redis-data:/data"]
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 24
  gateway:
    image: library/caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    environment:
      RUNNER_DOMAIN: ${RUNNER_DOMAIN:?Run manage.py init first}
      ACME_EMAIL: ${ACME_EMAIL:?Run manage.py init first}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?Run manage.py init first}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
networks:
  edge: {}
  backend:
    internal: true
volumes:
  postgres-data: {}
  redis-data: {}
  caddy-data: {}
  caddy-config: {}
